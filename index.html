<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InternshipOS</title>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: rgba(255,255,255,0.05);
    --surface2: rgba(255,255,255,0.09);
    --border: rgba(255,255,255,0.10);
    --border2: rgba(255,255,255,0.18);
    --text: #f0f0f5;
    --text2: rgba(240,240,245,0.55);
    --text3: rgba(240,240,245,0.30);
    --accent: #5e9bff;
    --accent2: #a78bfa;
    --green: #34d399;
    --orange: #fb923c;
    --pink: #f472b6;
    --yellow: #fbbf24;
    --font: 'Outfit', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    user-select: none;
  }

  /* ─── WALLPAPER ─── */
  #wallpaper {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 80% 60% at 20% 40%, #0d1f3c 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 70%, #1a0d2e 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 60% 10%, #0d2818 0%, transparent 50%),
                #080810;
    overflow: hidden;
  }
  #wallpaper::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.25) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.18;
  }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.18; pointer-events: none;
    animation: drift 20s infinite alternate ease-in-out;
  }
  .orb1 { width: 500px; height: 500px; background: #5e9bff; top: -100px; left: -100px; animation-delay: 0s; }
  .orb2 { width: 400px; height: 400px; background: #a78bfa; bottom: -80px; right: 10%; animation-delay: -7s; }
  .orb3 { width: 300px; height: 300px; background: #34d399; top: 30%; right: -50px; animation-delay: -13s; }
  @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,30px) scale(1.1); } }

  /* ─── SCREENS ─── */
  .screen { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease, visibility 0.6s; }
  .screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  /* ─── LOGIN ─── */
  #login-screen { flex-direction: column; gap: 0; background: rgba(8,8,16,0.75); backdrop-filter: blur(32px); }
  .login-avatar {
    width: 88px; height: 88px; border-radius: 50%;
    background: linear-gradient(135deg, #5e9bff, #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; margin-bottom: 20px;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.1), 0 0 60px rgba(94,155,255,0.3);
    animation: avatarPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes avatarPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .login-name {
    font-size: 28px; font-weight: 600; letter-spacing: -0.5px;
    margin-bottom: 4px;
    animation: fadeUp 0.5s 0.2s ease both;
  }
  .login-subtitle {
    font-size: 13px; color: var(--text2); margin-bottom: 32px;
    font-family: var(--mono); letter-spacing: 0.05em;
    animation: fadeUp 0.5s 0.3s ease both;
  }
  .pin-dots { display: flex; gap: 12px; margin-bottom: 32px; animation: fadeUp 0.5s 0.4s ease both; }
  .pin-dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1.5px solid var(--border2); background: transparent;
    transition: all 0.2s;
  }
  .pin-dot.filled { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px rgba(94,155,255,0.6); }
  .login-hint { font-size: 12px; color: var(--text3); animation: fadeUp 0.5s 0.5s ease both; }
  .login-btn {
    margin-top: 20px;
    padding: 12px 40px;
    border-radius: 50px;
    border: 1px solid var(--border2);
    background: rgba(94,155,255,0.15);
    color: var(--accent);
    font-family: var(--font);
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeUp 0.5s 0.6s ease both;
    letter-spacing: 0.02em;
  }
  .login-btn:hover { background: rgba(94,155,255,0.28); box-shadow: 0 0 24px rgba(94,155,255,0.2); transform: translateY(-1px); }
  .login-btn:active { transform: scale(0.97); }
  @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

  /* ─── DESKTOP ─── */
  #desktop-screen { flex-direction: column; justify-content: flex-start; align-items: stretch; pointer-events: none; opacity: 0; }
  #desktop-screen.active { pointer-events: all; }

  /* MENUBAR */
  #menubar {
    height: 28px;
    background: rgba(10,10,20,0.7);
    backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center;
    padding: 0 16px; gap: 20px;
    font-size: 12px; font-weight: 500;
    flex-shrink: 0; z-index: 100;
  }
  .menubar-logo { font-weight: 700; font-size: 13px; letter-spacing: -0.3px; }
  .menubar-logo span { color: var(--accent); }
  .menubar-items { display: flex; gap: 18px; color: var(--text2); }
  .menubar-items span { cursor: default; transition: color 0.15s; }
  .menubar-items span:hover { color: var(--text); }
  .menubar-right { margin-left: auto; display: flex; gap: 14px; color: var(--text2); font-family: var(--mono); font-size: 11px; align-items: center; }
  #clock { color: var(--text); font-weight: 500; }

  /* DESKTOP AREA */
  #desktop-area {
    flex: 1; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; padding-bottom: 80px;
  }

  /* ICONS GRID */
  #icons-grid {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 32px 48px; justify-content: center; align-items: flex-start;
    max-width: 900px; margin: 0 auto;
  }
  .app-icon {
    width: 110px; display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 12px 8px; border-radius: 14px; cursor: pointer;
    transition: background 0.15s, transform 0.15s;
    animation: iconDrop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .app-icon:hover { background: rgba(255,255,255,0.06); transform: translateY(-3px); }
  .app-icon:active { transform: scale(0.94); }
  .app-icon.bouncing { animation: iconBounce 0.4s ease; }
  @keyframes iconBounce { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-14px)} 60%{transform:translateY(-6px)} }
  @keyframes iconDrop { from{opacity:0;transform:scale(0.6) translateY(20px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .icon-img {
    width: 60px; height: 60px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; position: relative; overflow: visible;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
    transition: box-shadow 0.2s;
  }
  .app-icon:hover .icon-img { box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15); }
  .icon-label { font-size: 11px; color: var(--text); text-align: center; line-height: 1.35; text-shadow: 0 1px 4px rgba(0,0,0,0.8); font-weight: 400; }

  /* WELCOME BANNER */
  #welcome-banner {
    text-align: center; padding: 0 48px 20px;
    animation: fadeUp 0.5s 0.3s ease both;
  }
  #welcome-banner h1 { font-size: 15px; font-weight: 500; color: var(--text2); letter-spacing: 0.02em; }
  #welcome-banner p { font-size: 12px; color: var(--text3); font-family: var(--mono); margin-top: 4px; }

  /* ─── PANEL ─── */
  #panel {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%) translateY(120%);
    width: min(780px, calc(100vw - 48px));
    background: rgba(16,16,28,0.92);
    backdrop-filter: blur(40px);
    border: 0.5px solid var(--border2);
    border-radius: 20px;
    box-shadow: 0 -4px 60px rgba(0,0,0,0.6), 0 0 0 0.5px rgba(255,255,255,0.05) inset;
    z-index: 200;
    transition: transform 0.45s cubic-bezier(0.34,1.4,0.64,1), opacity 0.35s ease;
    opacity: 0;
    overflow: hidden;
  }
  #panel.visible { transform: translateX(-50%) translateY(0); opacity: 1; }

  .panel-drag { height: 5px; display: flex; justify-content: center; align-items: center; padding-top: 10px; margin-bottom: 2px; cursor: pointer; }
  .panel-drag-bar { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; }

  .panel-inner { padding: 20px 28px 28px; }
  .panel-top { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 20px; }
  .panel-icon { width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .panel-meta { flex: 1; }
  .panel-title { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 3px; }
  .panel-oneliner { font-size: 13px; color: var(--accent2); font-style: italic; margin-bottom: 10px; font-family: var(--mono); }
  .panel-desc { font-size: 13.5px; color: var(--text2); line-height: 1.7; }
  .panel-close { width: 28px; height: 28px; border-radius: 50%; background: var(--surface2); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; color: var(--text2); flex-shrink: 0; transition: all 0.15s; }
  .panel-close:hover { background: rgba(255,255,255,0.15); color: var(--text); }
  .panel-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .ptag {
    font-size: 11px; font-family: var(--mono); padding: 3px 10px; border-radius: 50px;
    border: 0.5px solid; letter-spacing: 0.03em;
  }
  .ptag.blue { background: rgba(94,155,255,0.1); color: #7eb5ff; border-color: rgba(94,155,255,0.25); }
  .ptag.purple { background: rgba(167,139,250,0.1); color: #b89eff; border-color: rgba(167,139,250,0.25); }
  .ptag.green { background: rgba(52,211,153,0.1); color: #5ee8b5; border-color: rgba(52,211,153,0.25); }
  .ptag.orange { background: rgba(251,146,60,0.1); color: #fdb07a; border-color: rgba(251,146,60,0.25); }
  .ptag.pink { background: rgba(244,114,182,0.1); color: #f9a8d4; border-color: rgba(244,114,182,0.25); }
  .panel-stats { display: flex; gap: 12px; margin-top: 16px; }
  .pstat { flex: 1; background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .pstat-val { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
  .pstat-label { font-size: 11px; color: var(--text3); font-family: var(--mono); }

  /* ─── DOCK ─── */
  #dock {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(24px);
    border: 0.5px solid var(--border2);
    border-radius: 20px;
    padding: 8px 16px;
    display: flex; gap: 8px; align-items: flex-end;
    z-index: 150;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .dock-sep { width: 0.5px; height: 36px; background: var(--border2); margin: 0 4px; align-self: center; }
  .dock-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    position: relative;
  }
  .dock-icon:hover { transform: translateY(-8px) scale(1.15); }
  .dock-icon::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); font-size: 11px; background: rgba(16,16,28,0.95); border: 0.5px solid var(--border2); padding: 3px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; pointer-events: none; font-family: var(--font); color: var(--text); }
  .dock-icon:hover::after { opacity: 1; }

  /* ─── TRANSITIONS ─── */
  #login-screen { transition: opacity 0.8s ease; }
  .screen-exit { opacity: 0 !important; pointer-events: none; }
</style>
</head>
<body>

<div id="wallpaper">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<!-- LOGIN -->
<div class="screen" id="login-screen">
  <div class="login-avatar">🧑‍💻</div>
  <div class="login-name">Intern #001</div>
  <div class="login-subtitle">// classified access · level: survived</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="login-hint">Enter PIN to access internship records</div>
  <button class="login-btn" onclick="doLogin()">Touch ID ✦</button>
</div>

<!-- DESKTOP -->
<div class="screen hidden" id="desktop-screen">
  <div id="menubar">
    <div class="menubar-logo">Intern<span>OS</span></div>
    <div class="menubar-items">
      <span>File</span><span>View</span><span>Tools</span><span>About</span>
    </div>
    <div class="menubar-right">
      <span>4 months · 7 tools</span>
      <span id="clock"></span>
    </div>
  </div>

  <div id="desktop-area">
    <div id="welcome-banner">
      <h1>Welcome back. Your 4-month build log is ready.</h1>
      <p>$ ls ~/internship/tools/ — 7 items found</p>
    </div>
    <div id="icons-grid"></div>
  </div>

  <div id="dock">
    <div class="dock-icon" data-tip="Home" style="background:linear-gradient(135deg,#1e3a5f,#2d6a9f)" onclick="closePanel()">🏠</div>
    <div class="dock-icon" data-tip="All Tools" style="background:linear-gradient(135deg,#2a1f4e,#5b3fa0)" onclick="showAll()">📦</div>
    <div class="dock-sep"></div>
    <div class="dock-icon" data-tip="Employee Portal" style="background:linear-gradient(135deg,#1e3a5f,#2d6a9f)" onclick="openPanel(0)">👤</div>
    <div class="dock-icon" data-tip="Req Extractor" style="background:linear-gradient(135deg,#3b1f5e,#6a35a8)" onclick="openPanel(1)">📄</div>
    <div class="dock-icon" data-tip="ID Comparator" style="background:linear-gradient(135deg,#1f4e3b,#2d8a5f)" onclick="openPanel(2)">🔍</div>
    <div class="dock-icon" data-tip="Traceability Matrix" style="background:linear-gradient(135deg,#4e3b1f,#8a6b2d)" onclick="openPanel(3)">🕸️</div>
    <div class="dock-icon" data-tip="TestCase Extractor" style="background:linear-gradient(135deg,#4e1f2a,#9a3550)" onclick="openPanel(4)">📋</div>
    <div class="dock-icon" data-tip="VECUSim" style="background:linear-gradient(135deg,#1f3a4e,#2d7a9a)" onclick="openPanel(5)">🚗</div>
    <div class="dock-icon" data-tip="Bull Game" style="background:linear-gradient(135deg,#3a1f1f,#9a3030)" onclick="openPanel(6)">🐂</div>
    <div class="dock-sep"></div>
    <div class="dock-icon" data-tip="Easter Egg 🥚" style="background:linear-gradient(135deg,#1a1a2e,#2d2d50)" onclick="openPanel(7)">❓</div>
  </div>
</div>

<!-- PANEL -->
<div id="panel">
  <div class="panel-drag" onclick="closePanel()"><div class="panel-drag-bar"></div></div>
  <div class="panel-inner">
    <div class="panel-top">
      <div class="panel-icon" id="p-icon"></div>
      <div class="panel-meta">
        <div class="panel-title" id="p-title"></div>
        <div class="panel-oneliner" id="p-oneliner"></div>
        <div class="panel-desc" id="p-desc"></div>
      </div>
      <div class="panel-close" onclick="closePanel()">✕</div>
    </div>
    <div class="panel-stats" id="p-stats"></div>
    <div class="panel-tags" id="p-tags"></div>
  </div>
</div>

<script>
const apps = [
  {
    emoji: '👤',
    bg: 'linear-gradient(135deg,#1e3a5f,#2d6a9f)',
    label: 'Employee\nPortal',
    title: 'Employee Portal',
    oneliner: '"HR asked for a form. I built them a whole operating system."',
    desc: 'A full-stack desktop HR application built entirely from scratch. Handles everything from employee profiles (10 sections!) to attendance calendars, performance analytics with radar charts and gauges, audit logging, and Excel/PDF export. Multi-role system with separate Admin and Employee dashboards.',
    stats: [
      { val: '10', label: 'profile sections' },
      { val: 'PyQt5', label: 'framework' },
      { val: 'SQLite', label: 'database' },
    ],
    tags: [['Multi-role dashboards','blue'],['Radar charts','purple'],['Attendance calendar','green'],['Excel / PDF export','orange'],['Audit logging','pink'],['DB backup','blue']]

    stats: [
      { val: '6+', label: 'table layouts' },
      { val: '3', label: 'translation fallbacks' },
      { val: 'concurrent', label: 'processing' },
    ],
    tags: [['Korean NLP','purple'],['3 fallback engines','orange'],['Drag & drop UI','green'],['Dark mode','blue'],['Animated progress','pink'],['Tabbed results','blue']]

  {

  {

    oneliner: '"I simulated a car\'s brain in a browser. For fun."',
    desc: 'The big one. A full virtual ECU simulator with a React frontend and Python/Flask backend. Implements the ISO 14229 UDS diagnostic protocol with 13 services, a complete ECU state machine (sessions, security access via Seed/Key, DTC memory, flash workflow), CAN trace logger, live signal monitoring, and real-time WebSocket updates.',

  },

    stats: [

  },
  {

// BUILD ICONS
const grid = document.getElementById('icons-grid');
apps.forEach((app, i) => {
  const div = document.createElement('div');
  div.className = 'app-icon';
  div.style.animationDelay = (i * 0.07) + 's';
  div.innerHTML = `
    <div class="icon-img" style="background:${app.bg}">${app.emoji}</div>
    <div class="icon-label">${app.label.replace('\n','<br>')}</div>
  `;
  div.addEventListener('click', () => { bounceIcon(div); openPanel(i); });
  grid.appendChild(div);
});

function bounceIcon(el) {
  el.classList.remove('bouncing');
  void el.offsetWidth;
  el.classList.add('bouncing');
  setTimeout(() => el.classList.remove('bouncing'), 400);
}

// LOGIN
let loginStep = 0;
function doLogin() {
  const pins = [0,1,2,3];
  if (loginStep >= 4) return;
  const fill = () => {
    if (loginStep < 4) {
      document.getElementById('d' + loginStep).classList.add('filled');
      loginStep++;
      if (loginStep < 4) setTimeout(fill, 120);
      else setTimeout(bootDesktop, 400);
    }
  };
  fill();
}

function bootDesktop() {
  const login = document.getElementById('login-screen');
  const desktop = document.getElementById('desktop-screen');
  login.classList.add('screen-exit');
  setTimeout(() => {
    login.classList.add('hidden');
    desktop.classList.remove('hidden');
    setTimeout(() => {
      desktop.style.opacity = '1';
      desktop.classList.add('active');
    }, 50);
  }, 700);
}

// PANEL
let panelOpen = false;
function openPanel(i) {
  const a = apps[i];
  document.getElementById('p-icon').style.background = a.bg;
  document.getElementById('p-icon').textContent = a.emoji;
  document.getElementById('p-title').textContent = a.title;
  document.getElementById('p-oneliner').textContent = a.oneliner;
  document.getElementById('p-desc').textContent = a.desc;

  const statsEl = document.getElementById('p-stats');
  statsEl.innerHTML = a.stats.map(s => `
    <div class="pstat">
      <div class="pstat-val" style="color:${statColor(i)}">${s.val}</div>
      <div class="pstat-label">${s.label}</div>
    </div>`).join('');

  const tagsEl = document.getElementById('p-tags');
  tagsEl.innerHTML = a.tags.map(([t, c]) => `<span class="ptag ${c}">${t}</span>`).join('');

  document.getElementById('panel').classList.add('visible');
  panelOpen = true;
}

function statColor(i) {
  const colors = ['#7eb5ff','#b89eff','#5ee8b5','#fdb07a','#f9a8d4','#7eb5ff','#fdb07a','#b89eff'];
  return colors[i] || '#7eb5ff';
}

function closePanel() {
  document.getElementById('panel').classList.remove('visible');
  panelOpen = false;
}

function showAll() {
  closePanel();
}

// CLOCK
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
updateClock();
setInterval(updateClock, 1000);

// Close panel on backdrop click
document.getElementById('desktop-area').addEventListener('click', (e) => {
  if (panelOpen && !e.target.closest('#panel') && !e.target.closest('.app-icon')) closePanel();
});

// Auto-fill PIN animation on load
setTimeout(() => {
  document.querySelector('.login-btn').style.animation = 'fadeUp 0.5s 0.6s ease both';
}, 100);
