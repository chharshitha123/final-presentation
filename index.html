<!DOCTYPE html>
<html>

<head>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>


<body class="m-0 h-screen overflow-hidden">

  <!-- DESKTOP PAGE -->
  <div id="desktopPage" class="absolute inset-0 bg-cover bg-center bg-[#D9D9D9]/30 bg-blend-overlay"
    style="background-image: url('./desktop-page/bg.png');">
    <div class="absolute top-[3vw] left-[3vw]">
      <div class="grid grid-cols-4 gap-x-[7vw] gap-y-[2.5vw]">

        <!-- Employee Portal -->
        <button id="employeeIcon"
          class="desktop-icon flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/Employee-Portal.png" alt="Employee Portal" class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Employee<br>Portal
          </span>
        </button>

        <!-- Requirement Extractor -->
        <button id="requirementsIcon"
          class="desktop-icon flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/Requirement Extractor.png" alt="Requirement Extractor"
            class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Requirement<br>Extractor
          </span>
        </button>

        <!-- Test Case Extractor -->
        <button id="testcaseIcon"
          class="desktop-icon flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/Test-Case Extractor.png" alt="Test Case Extractor"
            class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Test-Case<br>Extractor
          </span>
        </button>

        <!-- Bull Game -->
        <button id="bullIcon"
          class="desktop-icon flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/Bull Game.png" alt="Bull Game" class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Bull Game
          </span>
        </button>

        <!-- ID Comparator -->
        <button id="comparatorIcon"
          class="desktop-icon flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/ID-Comparator.png" alt="ID Comparator" class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            ID<br>Comparator
          </span>
        </button>

        <!-- Traceability Matrix -->
        <button id="traceabilityIcon"
          class="desktop-icon flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/Traceability Matrix.png" alt="Traceability Matrix"
            class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Traceability<br>Matrix
          </span>
        </button>

        <!-- VECU Sim -->
        <button id="vecuIcon"
          class="desktop-icon flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/VECU-Sim.png" alt="VECU Sim" class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            VECU-Sim
          </span>
        </button>

        <!-- Takeaways -->
        <button id="takeawaysIcon"
          class="desktop-icon flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/takeaways.png" alt="Takeaways" class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Takeaways
          </span>
        </button>


      </div>
    </div>
  </div>

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="absolute inset-0 bg-cover bg-center transition-transform duration-1000 ease-in-out"
    style="background-image: url('./login-page/login-bg.png');">

    <div class="h-full flex flex-col items-center justify-center pb-[5vw]">

      <div
        class="w-[12vw] h-[12vw] rounded-full bg-[#D9D9D9] shadow-[0_4px_4px_rgba(0,0,0,0.5)] flex justify-center items-center">
        <img src="./login-page/pfp.png" alt="Profile Picture" class="w-[10vw] h-[10vw] object-cover rounded-full">
      </div>

      <h1 class="text-[3.17vw] font-bold text-[#E3E3E3] [text-shadow:0px_4px_4px_rgba(0,0,0,0.5)]">
        HARSHITHA CH
      </h1>

      <div class="flex gap-[0.4vw] mt-[3vw] opacity-0" id="loader">
        <span class="dot w-[0.9vw] h-[0.9vw] rounded-full bg-[#E3E3E3] transition-all duration-300"></span>
        <span class="dot w-[0.9vw] h-[0.9vw] rounded-full bg-[#E3E3E3] transition-all duration-300"></span>
        <span class="dot w-[0.9vw] h-[0.9vw] rounded-full bg-[#E3E3E3] transition-all duration-300"></span>
        <span class="dot w-[0.9vw] h-[0.9vw] rounded-full bg-[#E3E3E3] transition-all duration-300"></span>
        <span class="dot w-[0.9vw] h-[0.9vw] rounded-full bg-[#E3E3E3] transition-all duration-300"></span>
      </div>

      <button id="loginBtn"
        class="w-[15.94vw] h-[4.23vw] rounded-full border-[0.3vw] border-[#C9A227] bg-[#E3E3E3] mt-[2vw] text-[#C9A227] font-bold text-[1.59vw] transition-all duration-300 cursor-pointer hover:bg-[#C9A227] hover:text-[#E3E3E3] hover:border-[#E3E3E3]">
        LOGIN
      </button>

    </div>

  </div>

  <!-- POPUP OVERLAY -->
  <div id="projectPopup" class="fixed inset-0 hidden items-center justify-center bg-black/20 z-50">

    <!-- WINDOW -->
    <div id="popupWindow"
      class="relative w-[80vw] h-[44vw] bg-[#6087C9] rounded-[1.04vw] border-[0.15vw] border-black shadow-[0_4px_4px_rgba(0,0,0,0.25)]">

      <!-- TITLE BAR -->
      <div class="absolute top-0 left-0 right-0 h-[3vw] flex justify-end items-center gap-[0.5vw] px-[1vw]">

        <!-- MINIMIZE -->
        <button id="minimizeBtn"
          class="w-[1.56vw] h-[1.56vw] rounded-[0.26vw] border-[0.17vw] border-black flex items-center justify-center bg-transparent">
          <svg width="15" height="2" viewBox="0 0 15 2" fill="none">
            <line x1="1" y1="1" x2="14" y2="1" stroke="black" stroke-width="2" />
          </svg>
        </button>

        <!-- MAXIMIZE -->
        <button id="maximizeBtn"
          class="w-[1.56vw] h-[1.56vw] rounded-[0.26vw] border-[0.17vw] border-black flex items-center justify-center bg-transparent">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <rect x="1" y="1" width="13" height="13" stroke="black" stroke-width="2" />
          </svg>
        </button>

        <!-- CLOSE -->
        <button id="closeBtn"
          class="w-[1.56vw] h-[1.56vw] rounded-[0.26vw] border-[0.17vw] border-black flex items-center justify-center bg-[#A81313]">
          <svg width="0.9vw" height="0.9vw" viewBox="0 0 22 22" fill="none">
            <path d="M5 5L17 17M17 5L5 17" stroke="black" stroke-width="4" stroke-linecap="round" />
          </svg>
        </button>

      </div>

      <!-- INNER PANEL -->
      <div class="absolute left-[0.78vw] right-[0.78vw] top-[2.7vw] bottom-[0.78vw]
      bg-[#D9D9D9]
      rounded-[0.78vw]
      border-[0.1vw] border-black
      shadow-[0_4px_4px_rgba(0,0,0,0.25)]">

        <div class="h-full px-[4vw] py-[3vw]">

          <!-- TITLE -->
          <h1 id="popupTitle" class="text-center text-[3.33vw] font-semibold">

          </h1>

          <img id="takeawayImage" src="./takeaways.png"
            class="hidden mx-auto mt-[2vw] mb-[2vw] w-[55vw] h-auto object-contain" />

          <!-- CONTENT -->
          <div id="projectContent" class="flex mt-[2vw] gap-[3vw]">

            <!-- IMAGE -->
            <img id="popupImage" src="" class="w-[8vw] h-[8vw] object-contain shrink-0">

            <!-- RIGHT CONTENT -->
            <div class="flex-1">

              <!-- QUOTE -->
              <div id="popupQuote" class="
              bg-[#C3CAD7]
              rounded-[0.4vw]
              px-[1.2vw]
              py-[0.8vw]
              text-[#A81313]
              italic
              font-semibold
              text-[1.67vw]
              leading-[1.2]
              ">
              </div>

              <!-- DESCRIPTION -->
              <div id="popupDescription" class="
              mt-[1.8vw]
              text-[1.25vw]
              font-semibold
              leading-[2]
              ">

              </div>

              <!-- BUTTON -->
              <div class="flex gap-[1vw] mt-[2vw]">

                <button id="downloadBtn" class="
    w-[9vw]
    h-[3vw]
    rounded-full
    border-[0.15vw]
    border-[#5D86D0]
    text-[#5D86D0]
    text-[1vw]
    font-bold
    transition-all
    duration-200
    hover:bg-[#5D86D0]
    hover:text-white
    ">
                  LET'S GO!
                </button>

                <button id="architectureBtn" class="
    w-[12vw]
    h-[3vw]
    rounded-full
    border-[0.15vw]
    border-[#5D86D0]
    text-[#5D86D0]
    text-[1vw]
    font-bold
    transition-all
    duration-200
    hover:bg-[#5D86D0]
    hover:text-white
    ">
                  VIEW ARCHITECTURE
                </button>

              </div>

            </div>

          </div>

          <div id="architectureView" class="hidden mt-[2vw] flex justify-center">

            <img id="architectureImage" src="./architecture/dummy.png" class="max-w-full max-h-[28vw] object-contain">

          </div>

        </div>

      </div>

    </div>

  </div>

  <script>

    const loginBtn = document.getElementById("loginBtn");
    const loader = document.getElementById("loader");
    const dots = document.querySelectorAll(".dot");

    loginBtn.addEventListener("click", async () => {

      loginBtn.disabled = true;

      loader.classList.remove("opacity-0");

      const yellow = "#C9A227";

      for (let i = 0; i < dots.length; i++) {

        await new Promise(resolve => setTimeout(resolve, 250));

        dots[i].style.backgroundColor = yellow;
        dots[i].style.transform = "scale(1.2)";
      }

      await new Promise(resolve => setTimeout(resolve, 500));

      document.getElementById("loginPage").style.transform =
        "translateY(-100vh)";
    });



    const projectPopup =
      document.getElementById("projectPopup");

    document
      .getElementById("closeBtn")
      .addEventListener("click", () => {

        projectPopup.classList.add("hidden");
        projectPopup.classList.remove("flex");

        takeawayImage.classList.add("hidden");

        projectContent.classList.remove("hidden");

        architectureView.classList.add("hidden");

        downloadBtn.style.display = "block";
        architectureBtn.style.display = "block";

      });

    const popupTitle =
      document.getElementById("popupTitle");

    const popupImage =
      document.getElementById("popupImage");

    const popupQuote =
      document.getElementById("popupQuote");

    const popupDescription =
      document.getElementById("popupDescription");

    const downloadBtn =
      document.getElementById("downloadBtn");

    const architectureBtn =
      document.getElementById("architectureBtn");

    const architectureView =
      document.getElementById("architectureView");

    const architectureImage =
      document.getElementById("architectureImage");

    const projectContent =
      document.getElementById("projectContent");

    /* employee icon */

    document
      .getElementById("employeeIcon")
      .addEventListener("click", () => {

        // Reset popup state
        projectContent.classList.remove("hidden");
        architectureView.classList.add("hidden");


        popupTitle.innerHTML =
          " Employee Portal";

        popupImage.src =
          "./icons/Employee-Portal.png";

        popupQuote.innerHTML =
          `"A whole HR system with dashboards, charts, and audit logs."`;

        popupDescription.innerHTML = `
    <p>Built with PyQt5 for the desktop interface and SQLite as the database.</p>

    <p>Features separate Admin and Employee portals with role-based access.</p>

    <p>Supports employee management, attendance tracking, reports, charts, PDF generation, and Excel export.</p>
  `;

        downloadBtn.onclick = () => {
          window.location.href =
            "trial.exe";
        };

        architectureBtn.onclick = () => {

          architectureImage.src =
            "./icons/Employee-Portal.png";

          projectContent.classList.add("hidden");
          architectureView.classList.remove("hidden");

        };

        projectPopup.classList.remove("hidden");
        projectPopup.classList.add("flex");

      });

    /* req icon */
    document
      .getElementById("requirementsIcon")
      .addEventListener("click", () => {

        // Reset popup state
        projectContent.classList.remove("hidden");
        architectureView.classList.add("hidden");

        popupTitle.innerHTML =
          " Requirement Extractor";

        popupImage.src =
          "./icons/Requirement Extractor.png";

        popupQuote.innerHTML =
          `"Drag in a complex requirements document and get back a clean, structured Excel sheet."`;

        popupDescription.innerHTML = `
    <p>Built to automate requirement extraction from large .docx documents.</p>

    <p>Identifies and extracts requirement IDs, descriptions, and related information into a structured format.</p>

    <p>Supports Korean document processing with translation capabilities and exports everything into Excel for easier analysis and tracking.</p>
  `;

        downloadBtn.onclick = () => {
          window.location.href =
            "./downloads/requirements.exe";
        };

        architectureBtn.onclick = () => {

          architectureImage.src =
            "./architecture/requirements-architecture.png";

          projectContent.classList.add("hidden");
          architectureView.classList.remove("hidden");

        };

        projectPopup.classList.remove("hidden");
        projectPopup.classList.add("flex");

      });

    /* testcase icon */
    document
      .getElementById("testcaseIcon")
      .addEventListener("click", () => {

        // Reset popup state
        projectContent.classList.remove("hidden");
        architectureView.classList.add("hidden");

        popupTitle.innerHTML =
          " Test Case Extractor";

        popupImage.src =
          "./icons/Test-Case Extractor.png";

        popupQuote.innerHTML =
          `"Reads the entire document, finds every test case, and organizes them into Excel automatically."`;

        popupDescription.innerHTML = `
    <p>Built to automate the extraction of test cases from large requirement and validation documents.</p>

    <p>Identifies test case IDs, titles, descriptions, expected results, and related metadata using document structure and pattern matching.</p>

    <p>Exports all extracted test cases into a clean, formatted Excel sheet, significantly reducing manual effort.</p>
  `;

        downloadBtn.onclick = () => {
          window.location.href =
            "./downloads/testcase.exe";
        };

        architectureBtn.onclick = () => {

          architectureImage.src =
            "./architecture/testcase-architecture.png";

          projectContent.classList.add("hidden");
          architectureView.classList.remove("hidden");

        };

        projectPopup.classList.remove("hidden");
        projectPopup.classList.add("flex");

      });

    /* id comp icon */
    document
      .getElementById("comparatorIcon")
      .addEventListener("click", () => {

        // Reset popup state
        projectContent.classList.remove("hidden");
        architectureView.classList.add("hidden");

        popupTitle.innerHTML =
          " ID Comparator";

        popupImage.src =
          "./icons/ID-Comparator.png";

        popupQuote.innerHTML =
          `"Give it two documents and it instantly tells you what's been added, removed, or modified."`;

        popupDescription.innerHTML = `
    <p>Built to compare requirement IDs across different versions of specification documents.</p>

    <p>Automatically detects newly added, deleted, modified, and unchanged IDs using intelligent comparison logic.</p>

    <p>Generates a color-coded Excel report, making requirement change tracking fast and reliable.</p>
  `;

        downloadBtn.onclick = () => {
          window.location.href =
            "./downloads/comparator.exe";
        };

        architectureBtn.onclick = () => {

          architectureImage.src =
            "./architecture/comparator-architecture.png";

          projectContent.classList.add("hidden");
          architectureView.classList.remove("hidden");

        };

        projectPopup.classList.remove("hidden");
        projectPopup.classList.add("flex");

      });

    /* traceability icon */
    document
      .getElementById("traceabilityIcon")
      .addEventListener("click", () => {

        // Reset popup state
        projectContent.classList.remove("hidden");
        architectureView.classList.add("hidden");

        popupTitle.innerHTML =
          " Traceability Matrix";

        popupImage.src =
          "./icons/Traceability Matrix.png";

        popupQuote.innerHTML =
          `"Connect requirements to components with a single click and eliminate manual traceability work."`;

        popupDescription.innerHTML = `
    <p>Built to generate a complete traceability matrix between requirements and software components.</p>

    <p>Extracts requirement IDs, component mappings, and related references from project documentation automatically.</p>

    <p>Produces a structured Excel matrix that simplifies impact analysis, audits, and requirement verification.</p>
  `;

        downloadBtn.onclick = () => {
          window.location.href =
            "./downloads/traceability.exe";
        };

        architectureBtn.onclick = () => {

          architectureImage.src =
            "./architecture/traceability-architecture.png";

          projectContent.classList.add("hidden");
          architectureView.classList.remove("hidden");

        };

        projectPopup.classList.remove("hidden");
        projectPopup.classList.add("flex");

      });

    /* vecu icon */
    document
      .getElementById("vecuIcon")
      .addEventListener("click", () => {

        // Reset popup state
        projectContent.classList.remove("hidden");
        architectureView.classList.add("hidden");

        popupTitle.innerHTML =
          " VECU Sim";

        popupImage.src =
          "./icons/VECU-Sim.png";

        popupQuote.innerHTML =
          `"A virtual ECU that brings automotive diagnostics and vehicle behavior to life in real time."`;

        popupDescription.innerHTML = `
    <p>Developed as a browser-based Virtual Electronic Control Unit simulator for automotive systems.</p>

    <p>Implements multiple UDS diagnostic services including session control, security access, DTC management, and ECU reset functionality.</p>

    <p>Uses a React frontend and Flask backend with WebSocket communication for real-time monitoring, diagnostics, and vehicle state updates.</p>
  `;

        downloadBtn.onclick = () => {
          window.location.href =
            "./downloads/vecu.exe";
        };

        architectureBtn.onclick = () => {

          architectureImage.src =
            "./architecture/vecu-architecture.png";

          projectContent.classList.add("hidden");
          architectureView.classList.remove("hidden");

        };

        projectPopup.classList.remove("hidden");
        projectPopup.classList.add("flex");

      });

    /* bull game */
    document
      .getElementById("bullIcon")
      .addEventListener("click", () => {

        downloadBtn.style.display = "block";
        architectureBtn.style.display = "block";

        takeawayImage.classList.add("hidden");



        // Reset popup state
        projectContent.classList.remove("hidden");
        architectureView.classList.add("hidden");

        popupTitle.innerHTML =
          "Bull Game";

        popupImage.src =
          "./icons/Bull Game.png";

        popupQuote.innerHTML =
          `"A robot that sees red and charges straight toward it."`;

        popupDescription.innerHTML = `
    <p>Built using ROS1 and C++ to control a physical mobile robot in real time.</p>

    <p>Processes live camera feeds using computer vision techniques to detect and track red objects.</p>

    <p>Generates movement commands dynamically, allowing the robot to navigate and chase its target autonomously.</p>
  `;

        downloadBtn.onclick = () => {
          window.location.href =
            "./downloads/bull.exe";
        };

        architectureBtn.onclick = () => {

          architectureImage.src =
            "./architecture/bull-architecture.png";

          projectContent.classList.add("hidden");
          architectureView.classList.remove("hidden");

        };

        projectPopup.classList.remove("hidden");
        projectPopup.classList.add("flex");

      });

    /* takeaways */
    document
      .getElementById("takeawaysIcon")
      .addEventListener("click", () => {

        popupTitle.innerHTML =
          "The people made all the difference.";

        // Hide normal content
        projectContent.classList.add("hidden");

        // Hide architecture view
        architectureView.classList.add("hidden");

        // Hide buttons
        downloadBtn.style.display = "none";
        architectureBtn.style.display = "none";

        // Show takeaway image
        takeawayImage.classList.remove("hidden");

        projectPopup.classList.remove("hidden");
        projectPopup.classList.add("flex");

      });
  </script>

</body>





</html>
