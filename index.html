<!DOCTYPE html>
<html>

<head>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>


<body class="m-0 h-screen overflow-hidden">

  <!-- DESKTOP PAGE -->
  <div id="desktopPage" class="absolute inset-0 bg-cover bg-center bg-[#D9D9D9]/30 bg-blend-overlay"
    style="background-image: url('./desktop-page/bg.png');">
    <div class="absolute top-[3vw] left-[3vw]">
      <div class="grid grid-cols-4 gap-x-[7vw] gap-y-[2.5vw]">

        <!-- Employee Portal -->
        <button class="flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/Employee Portal.png" alt="Employee Portal" class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Employee<br>Portal
          </span>
        </button>

        <!-- Requirement Extractor -->
        <button class="flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/Requirement Extractor.png" alt="Requirement Extractor"
            class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Requirement<br>Extractor
          </span>
        </button>

        <!-- Test-Case Extractor -->
        <button class="flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/Test-Case Extractor.png" alt="Test-Case Extractor"
            class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Text-Case<br>Extractor
          </span>
        </button>

        <!-- Bull Game -->
        <button class="flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/Bull Game.png" alt="Bull Game" class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Bull Game
          </span>
        </button>

        <!-- ID Comparator -->
        <button class="flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/ID-Comparator.png" alt="ID Comparator" class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            ID<br>Comparator
          </span>
        </button>

        <!-- Traceability Matrix -->
        <button class="flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/Traceability Matrix.png" alt="Traceability Matrix"
            class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Traceability<br>Matrix
          </span>
        </button>

        <!-- VECU-Sim -->
        <button class="flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/VECU-Sim.png" alt="VECU-Sim" class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            VECU-Sim
          </span>
        </button>

        <!-- Takeaways -->
        <button class="flex flex-col items-center w-[10.38vw] rounded-[0.4vw] p-[0.3vw] transition-all duration-200 hover:bg-white/40">
          <img src="./icons/takeaways.png" alt="VECU-Sim" class="w-[6.61vw] h-[6.61vw] object-contain">
          <span class="w-[10.38vw] text-center text-[1.59vw] font-semibold text-black leading-[1.1]">
            Takeaways
          </span>
        </button>

      </div>
    </div>
  </div>

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="absolute inset-0 bg-cover bg-center transition-transform duration-1000 ease-in-out"
    style="background-image: url('./login-page/login-bg.png');">

    <div class="h-full flex flex-col items-center justify-center pb-[5vw]">

      <div
        class="w-[12vw] h-[12vw] rounded-full bg-[#D9D9D9] shadow-[0_4px_4px_rgba(0,0,0,0.5)] flex justify-center items-center">
        <img src="./login-page/pfp.png" alt="Profile Picture" class="w-[10vw] h-[10vw] object-cover rounded-full">
      </div>

      <h1 class="text-[3.17vw] font-bold text-[#E3E3E3] [text-shadow:0px_4px_4px_rgba(0,0,0,0.5)]">
        HARSHITHA CH
      </h1>

      <div class="flex gap-[0.4vw] mt-[3vw] opacity-0" id="loader">
        <span class="dot w-[0.9vw] h-[0.9vw] rounded-full bg-[#E3E3E3] transition-all duration-300"></span>
        <span class="dot w-[0.9vw] h-[0.9vw] rounded-full bg-[#E3E3E3] transition-all duration-300"></span>
        <span class="dot w-[0.9vw] h-[0.9vw] rounded-full bg-[#E3E3E3] transition-all duration-300"></span>
        <span class="dot w-[0.9vw] h-[0.9vw] rounded-full bg-[#E3E3E3] transition-all duration-300"></span>
        <span class="dot w-[0.9vw] h-[0.9vw] rounded-full bg-[#E3E3E3] transition-all duration-300"></span>
      </div>

      <button id="loginBtn"
        class="w-[15.94vw] h-[4.23vw] rounded-full border-[0.3vw] border-[#C9A227] bg-[#E3E3E3] mt-[2vw] text-[#C9A227] font-bold text-[1.59vw] transition-all duration-300 cursor-pointer hover:bg-[#C9A227] hover:text-[#E3E3E3] hover:border-[#E3E3E3]">
        LOGIN
      </button>

    </div>

  </div>

  <script>
    const loginBtn = document.getElementById("loginBtn");
    const loader = document.getElementById("loader");
    const dots = document.querySelectorAll(".dot");

    loginBtn.addEventListener("click", async () => {

      loginBtn.disabled = true;

      loader.classList.remove("opacity-0");

      const yellow = "#C9A227";

      for (let i = 0; i < dots.length; i++) {

        await new Promise(resolve => setTimeout(resolve, 250));

        dots[i].style.backgroundColor = yellow;
        dots[i].style.transform = "scale(1.2)";
      }

      await new Promise(resolve => setTimeout(resolve, 500));

      document.getElementById("loginPage").style.transform =
        "translateY(-100vh)";
    });
  </script>

</body>





</html>
